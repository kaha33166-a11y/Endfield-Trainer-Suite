            function E1RF5() {
              const C5xT = Math.floor(Math.random() * 10000);
              return `${N0K8_[Math.floor(Math.random() * N0K8_.length)]} ${N0K8_[Math.floor(Math.random() * N0K8_.length)]} ${N0K8_[Math.floor(Math.random() * N0K8_.length)]} (${C5xT})`;
            }
            
            let L_5aTn;
            for (let lXRp = 1; lXRp <= 5; lXRp++) {
              try {
